  - {date: 2026-10-27, lecon: "Xelanc n'est pas un Financité bis : plateforme en libre-service sur abonnement (modèle CFI). Ni session, ni cohorte, ni pipeline commercial. La pub amène sur le site, et c'est le site qui vend la richesse ; les certificats sont inclus et passés en autonomie. Ne pas réintroduire de mécanique de vente humaine (formulaires de leads, appels de conclusion) dans les recommandations."}

