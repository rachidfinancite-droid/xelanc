strategie:
  - date: 2026-10-31
    fichier: excellence/linkedin-strategie-2026-10-31.md
    verdict: "LinkedIn = porte employeur + précision, pas canal de volume particulier. Coût par compte gratuit estimé 50-270 € [E/H] contre ≈ 5 $ sur Meta [M 27/10]. Un abonné individuel via LinkedIn coûterait 300-1 200 € [E/H], au-dessus du seuil 120 €. Le test ne bouge pas le cash de novembre ; il mesure le payeur employeur (Équipes 249 €/place, dès 3 ou 5 places [M])."
    decision_n1: "Valider le rôle et un plafond de 1 600 € (Phase 1 : 1 100 €, 10/11→07/12 ; Phase 2 Message Ad : 500 €, 07/12→18/12) ; aucun euro avant P1-P4 ; avant le 06/11"
    phases: ["Phase 0 (31/10→09/11) prérequis gratuits + LinkedIn organique", "Phase 1 (10/11→07/12) 2 campagnes contenu sponsorisé Finance d'entreprise + Banque, 20 €/j chacune, lecture 24/11, verdict 08/12", "Phase 2 (07/12→18/12) 1 Message Ad à la porte gagnante, texte validé"]
    criteres_arret: "pas de verdict < 100 clics ou 500 € par porte ; stop porte si clic→compte < 2 % ; arrêt payant si 1 100 € sans devis ni abonné ; passage Phase 2 si coût/compte < 60 € et ≥ 1 devis qualifié"
    objectifs_si_valide: "coût/demande de devis Équipes ≤ 150 € ; coût/vente Équipes ≤ 310 € ; part employeur ≥ 50 % ; échelle 1 500-3 000 €/mois pour ≈ 2 ventes Équipes/mois [H]"

