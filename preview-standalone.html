<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XELANC Finance Academy - Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fadeIn {
            animation: fadeIn 0.4s ease-out;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // Données de configuration
        const NAVIGATION_TABS = [
            { id: 2, label: 'Analyste Crédit', icon: '📊' },
            { id: 3, label: 'Chargé d\'Affaires', icon: '💼' },
            { id: 4, label: 'Directeur d\'Agence', icon: '🏦' },
            { id: 5, label: 'Analyste M&A', icon: '📈' },
        ];

        let currentPage = 2;

        // Fonction pour rendre les pages
        function renderPage(pageId) {
            const pages = {
                2: `
                    <div class="bg-gradient-to-br from-[#151923]/80 to-[#1a1f2e]/80 backdrop-blur-sm rounded-2xl p-8 border border-white/5 shadow-2xl">
                        <div class="mb-8">
                            <div class="flex items-center gap-4 mb-4">
                                <div class="w-16 h-16 bg-gradient-to-r from-blue-600 to-blue-500 rounded-2xl flex items-center justify-center text-3xl shadow-lg shadow-blue-500/30">
                                    📊
                                </div>
                                <div>
                                    <h2 class="text-3xl font-bold text-white mb-1">Analyste Crédit</h2>
                                    <p class="text-gray-400 text-sm">Évaluez et gérez les risques de crédit</p>
                                </div>
                            </div>
                            <div class="h-1 w-24 bg-gradient-to-r from-blue-500 to-transparent rounded-full"></div>
                        </div>
                        <div class="mb-8">
                            <h3 class="text-xl font-semibold text-white mb-4">Description du poste</h3>
                            <p class="text-gray-300 leading-relaxed">
                                L'analyste crédit joue un rôle crucial dans l'évaluation de la solvabilité des clients
                                et la gestion des risques financiers. Ce professionnel examine les états financiers,
                                analyse les tendances du marché et élabore des recommandations pour les décisions de crédit.
                            </p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="bg-[#1F3A4C]/40 p-4 rounded-xl border border-blue-500/20 hover:border-blue-500/40 transition-all duration-300 hover:transform hover:scale-105">
                                <div class="flex items-start gap-3">
                                    <span class="text-2xl">📈</span>
                                    <div>
                                        <h4 class="font-semibold text-white mb-1">Analyse Financière</h4>
                                        <p class="text-gray-400 text-sm">Maîtrise des ratios et indicateurs financiers</p>
                                    </div>
                                </div>
                            </div>
                            <div class="bg-[#1F3A4C]/40 p-4 rounded-xl border border-blue-500/20 hover:border-blue-500/40 transition-all duration-300 hover:transform hover:scale-105">
                                <div class="flex items-start gap-3">
                                    <span class="text-2xl">⚠️</span>
                                    <div>
                                        <h4 class="font-semibold text-white mb-1">Évaluation des Risques</h4>
                                        <p class="text-gray-400 text-sm">Identification et quantification des risques</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `,
                3: `
                    <div class="bg-gradient-to-br from-[#151923]/80 to-[#1a1f2e]/80 backdrop-blur-sm rounded-2xl p-8 border border-white/5 shadow-2xl">
                        <div class="mb-8">
                            <div class="flex items-center gap-4 mb-4">
                                <div class="w-16 h-16 bg-gradient-to-r from-emerald-600 to-emerald-500 rounded-2xl flex items-center justify-center text-3xl shadow-lg shadow-emerald-500/30">
                                    💼
                                </div>
                                <div>
                                    <h2 class="text-3xl font-bold text-white mb-1">Chargé d'Affaires</h2>
                                    <p class="text-gray-400 text-sm">Développez et gérez un portefeuille clients</p>
                                </div>
                            </div>
                            <div class="h-1 w-24 bg-gradient-to-r from-emerald-500 to-transparent rounded-full"></div>
                        </div>
                        <div class="mb-8">
                            <h3 class="text-xl font-semibold text-white mb-4">Description du poste</h3>
                            <p class="text-gray-300 leading-relaxed">
                                Le chargé d'affaires est le conseiller privilégié des entreprises. Il accompagne ses clients
                                dans leurs projets de développement, finance leurs investissements et optimise leur trésorerie.
                            </p>
                        </div>
                    </div>
                `,
                4: `
                    <div class="bg-gradient-to-br from-[#151923]/80 to-[#1a1f2e]/80 backdrop-blur-sm rounded-2xl p-8 border border-white/5 shadow-2xl">
                        <div class="mb-8">
                            <div class="flex items-center gap-4 mb-4">
                                <div class="w-16 h-16 bg-gradient-to-r from-purple-600 to-purple-500 rounded-2xl flex items-center justify-center text-3xl shadow-lg shadow-purple-500/30">
                                    🏦
                                </div>
                                <div>
                                    <h2 class="text-3xl font-bold text-white mb-1">Directeur d'Agence</h2>
                                    <p class="text-gray-400 text-sm">Pilotez la performance et managez les équipes</p>
                                </div>
                            </div>
                            <div class="h-1 w-24 bg-gradient-to-r from-purple-500 to-transparent rounded-full"></div>
                        </div>
                        <div class="mb-8">
                            <h3 class="text-xl font-semibold text-white mb-4">Description du poste</h3>
                            <p class="text-gray-300 leading-relaxed">
                                Le directeur d'agence bancaire assure le développement commercial et la gestion opérationnelle
                                de son point de vente. Manager confirmé, il anime ses équipes et garantit l'atteinte des objectifs.
                            </p>
                        </div>
                    </div>
                `,
                5: `
                    <div class="bg-gradient-to-br from-[#151923]/80 to-[#1a1f2e]/80 backdrop-blur-sm rounded-2xl p-8 border border-white/5 shadow-2xl">
                        <div class="mb-8">
                            <div class="flex items-center gap-4 mb-4">
                                <div class="w-16 h-16 bg-gradient-to-r from-amber-600 to-amber-500 rounded-2xl flex items-center justify-center text-3xl shadow-lg shadow-amber-500/30">
                                    📈
                                </div>
                                <div>
                                    <h2 class="text-3xl font-bold text-white mb-1">Analyste M&A</h2>
                                    <p class="text-gray-400 text-sm">Expertise en fusions et acquisitions</p>
                                </div>
                            </div>
                            <div class="h-1 w-24 bg-gradient-to-r from-amber-500 to-transparent rounded-full"></div>
                        </div>
                        <div class="mb-8">
                            <h3 class="text-xl font-semibold text-white mb-4">Description du poste</h3>
                            <p class="text-gray-300 leading-relaxed">
                                L'analyste M&A conseille les entreprises dans leurs opérations de croissance externe.
                                Il réalise des valorisations d'entreprises, structure les transactions et coordonne les due diligences.
                            </p>
                        </div>
                    </div>
                `
            };
            return pages[pageId] || pages[2];
        }

        // Fonction pour rendre l'application
        function render() {
            const currentIndex = NAVIGATION_TABS.findIndex(t => t.id === currentPage);
            const app = document.getElementById('app');

            app.innerHTML = `
                <div class="min-h-screen bg-gradient-to-br from-[#0a0e1a] via-[#0d0d0d] to-[#0a1628] flex flex-col items-center justify-center p-6 md:p-10">
                    <!-- Navigation Container -->
                    <div class="w-full max-w-6xl mb-8">
                        <!-- Navigation Header -->
                        <div class="text-center mb-6">
                            <h1 class="text-white text-2xl md:text-3xl font-bold mb-2 tracking-tight">
                                Parcours Professionnels
                            </h1>
                            <p class="text-gray-400 text-sm md:text-base">
                                Sélectionnez votre spécialisation en finance bancaire
                            </p>
                        </div>

                        <!-- Navigation Tabs -->
                        <nav class="relative bg-[#151923]/50 backdrop-blur-sm rounded-2xl p-2 border border-white/5 shadow-2xl">
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                                ${NAVIGATION_TABS.map(tab => `
                                    <button
                                        onclick="setPage(${tab.id})"
                                        class="group relative px-4 py-4 md:py-3.5 rounded-xl transition-all duration-300 ease-out overflow-hidden ${
                                            currentPage === tab.id
                                                ? 'bg-gradient-to-r from-blue-600 to-blue-500 text-white shadow-lg shadow-blue-500/30'
                                                : 'bg-[#1a1f2e]/60 text-gray-300 hover:bg-[#1F3A4C]/80 hover:text-white'
                                        }"
                                    >
                                        <!-- Hover Glow Effect -->
                                        <div class="absolute inset-0 bg-gradient-to-r from-blue-400/20 to-blue-600/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300 ${currentPage === tab.id ? 'hidden' : ''}"></div>

                                        <!-- Content -->
                                        <div class="relative flex flex-col md:flex-row items-center justify-center gap-2">
                                            <span class="text-2xl md:text-xl" role="img" aria-hidden="true">
                                                ${tab.icon}
                                            </span>
                                            <span class="font-semibold text-xs md:text-sm tracking-wide text-center md:text-left">
                                                ${tab.label}
                                            </span>
                                        </div>

                                        <!-- Active Indicator -->
                                        ${currentPage === tab.id ? '<div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1/3 h-1 bg-white rounded-full shadow-lg shadow-white/50"></div>' : ''}
                                    </button>
                                `).join('')}
                            </div>
                        </nav>

                        <!-- Progress Indicator -->
                        <div class="flex items-center justify-center gap-2 mt-4">
                            ${NAVIGATION_TABS.map(tab => `
                                <div class="h-1.5 rounded-full transition-all duration-300 ${
                                    currentPage === tab.id
                                        ? 'w-12 bg-gradient-to-r from-blue-500 to-blue-400 shadow-lg shadow-blue-500/50'
                                        : 'w-1.5 bg-gray-600/50'
                                }"></div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Page Content -->
                    <div class="w-full max-w-7xl">
                        <div class="animate-fadeIn">
                            ${renderPage(currentPage)}
                        </div>
                    </div>
                </div>
            `;
        }

        // Fonction pour changer de page
        window.setPage = function(pageId) {
            currentPage = pageId;
            render();
        };

        // Rendu initial
        render();
    </script>
</body>
</html>
